groups:
  - name: instance_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

  - name: container_alerts
    rules:
      - alert: HighCpuUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{id=~"/docker/.*"}[5m])) by (id) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.id }}"
          description: "Container {{ $labels.id }} CPU usage is above 80% for 5 minutes. Current: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes{id=~"/docker/.*"} / container_spec_memory_limit_bytes{id=~"/docker/.*"} * 100) > 85 and container_spec_memory_limit_bytes{id=~"/docker/.*"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.id }}"
          description: "Container {{ $labels.id }} memory usage is above 85%. Current: {{ $value }}%"

  - name: database_alerts
    rules:
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter reports the database is unreachable."

      - alert: DatabaseHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of DB connections"
          description: "PostgreSQL active connections: {{ $value }}"

  - name: nginx_alerts
    rules:
      - alert: NginxHighErrorRate
        expr: (rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Nginx 5xx error rate"
          description: "Nginx 5xx error rate is above 5%. Current: {{ $value }}%"

  - name: system_alerts
    rules:
      - alert: DiskSpaceRunningLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running low"
          description: "Available disk space is below 15%. Current available: {{ $value }}%"
