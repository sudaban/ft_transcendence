# ============================================================
# Logstash Pipeline Yapılandırması — Log İşleme Motoru
# ============================================================
# Logstash, Filebeat'ten gelen ham logları alır, işler (filter)
# ve Elasticsearch'e yazar. Üç bölümden oluşur:
#   1. input  → Logları nereden al
#   2. filter → Logları nasıl işle/zenginleştir
#   3. output → İşlenen logları nereye yaz
#
# Akış: Filebeat → [Logstash input → filter → output] → Elasticsearch
# ============================================================

# ---- Giriş (Input): Logları nereden al ----
input {
  # Beats protokolü ile Filebeat'ten log al
  # Filebeat 5044 portuna bağlanarak logları buraya gönderir
  beats {
    port => 5044
  }
}

# ---- Filtre (Filter): Logları işle/zenginleştir ----
filter {
  # Container adı bilgisi varsa, "service_name" alanı ekle
  # Böylece Kibana'da "service_name: transcendence-backend" diye filtreleme yapılabilir
  if [container][name] {
    mutate {
      # container.name alanındaki değeri yeni bir "service_name" alanına kopyala
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Eğer message alanı JSON formatındaysa parse et
  # Böylece log.level, service.name gibi alanlar ayrı field olarak Kibana'da filtrelenebilir
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "log_data"
      skip_on_invalid_json => true
    }
  }

  # stream alanı varsa (stdout/stderr) log_stream olarak etiketle
  if [stream] {
    mutate {
      rename => { "stream" => "log_stream" }
    }
  }

  # Gereksiz Filebeat metadata alanlarını temizle
  # Elasticsearch'te yer israfını önler
  mutate {
    remove_field => [ "[agent][ephemeral_id]", "[agent][id]", "[agent][version]", "[ecs]", "[input]", "[log][offset]", "@version" ]
  }
}

# ---- Çıkış (Output): İşlenen logları nereye yaz ----
output {
  # Elasticsearch'e yaz — burada loglar aranabilir hale gelir
  elasticsearch {
    # Elasticsearch sunucu adresi (Docker network içinde)
    hosts => ["elasticsearch:9200"]
    # Her gün yeni bir index oluştur (logstash-2026.07.12 gibi)
    # Bu sayede eski loglar gün bazında silinebilir/yönetilebilir
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
