services:
  database:
    image: postgres:16-alpine
    container_name: transcendence-db
    init: true
    labels:
      - "autoheal=true"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-transcendence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transcendence-network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: ../Devops/docker/backend.Dockerfile
    container_name: transcendence-backend
    init: true
    labels:
      - "autoheal=true"
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=${DB_NAME:-transcendence};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Development}
      DOTNET_EnableWriteXorExecute: "0"
      OAUTH_INTRA_CLIENT_ID: "${OAUTH_INTRA_CLIENT_ID:-default-42-client-id}"
      OAUTH_INTRA_CLIENT_SECRET: "${OAUTH_INTRA_CLIENT_SECRET:-default-42-client-secret}"
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-default-google-client-id}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-default-google-client-secret}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3-flash-preview}"
      HTTP_PORT: "${HTTP_PORT}"
      HTTPS_PORT: "${HTTPS_PORT}"
    volumes:
      - ./uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- http://127.0.0.1:5000/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transcendence-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: ../Devops/docker/frontend.Dockerfile
    container_name: transcendence-frontend
    init: true
    labels:
      - "autoheal=true"
    env_file:
      - .env
    environment:
      PUBLIC_API_URL: "https://localhost:${HTTPS_PORT}/api"
      PUBLIC_42_CLIENT_ID: "${OAUTH_INTRA_CLIENT_ID:-}"
      PUBLIC_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transcendence-network
    restart: unless-stopped

  nginx:
    build:
      context: ./Devops/nginx
      dockerfile: ../docker/nginx.Dockerfile
    container_name: transcendence-nginx
    init: true
    labels:
      - "autoheal=true"
    depends_on:
      - frontend
      - backend
    environment:
      HTTPS_PORT: "${HTTPS_PORT}"
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/nginx_status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transcendence-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    profiles: ["monitoring"]
    user: root
    init: true
    labels:
      - "autoheal=true"
    volumes:
      - ./Devops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Devops/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=500MB"
      - "--web.enable-lifecycle"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=/prometheus/"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/prometheus/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transcendence-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    profiles: ["monitoring"]
    init: true
    labels:
      - "autoheal=true"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-transcendence42}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://localhost:${HTTPS_PORT}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Devops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./Devops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Devops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Port kaldırıldı — sadece Nginx üzerinden erişilir (/grafana/)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transcendence-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: transcendence-node-exporter
    profiles: ["monitoring"]
    init: true
    labels:
      - "autoheal=true"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transcendence-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: transcendence-cadvisor
    profiles: ["monitoring"]
    init: true
    labels:
      - "autoheal=true"
    privileged: true
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--housekeeping_interval=15s"
      - "--raw_cgroup_prefix_whitelist=/docker"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transcendence-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: transcendence-postgres-exporter
    profiles: ["monitoring"]
    init: true
    labels:
      - "autoheal=true"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-transcendence}?sslmode=disable"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transcendence-network
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: transcendence-nginx-exporter
    profiles: ["monitoring"]
    init: true
    labels:
      - "autoheal=true"
    depends_on:
      - nginx
    command:
      - "--nginx.scrape-uri=http://nginx:8888/nginx_status"
    networks:
      - transcendence-network
    restart: unless-stopped

  autoheal:
    build:
      context: ./Devops/monitoring/autoheal
      dockerfile: ../../docker/autoheal.Dockerfile
    container_name: transcendence-autoheal
    init: true
    environment:
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - transcendence-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: transcendence-elasticsearch
    profiles: ["elk"]
    init: true
    environment:
      - node.store.allow_mmap=false
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms128m -Xmx128m"
    volumes:
      - elk_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - transcendence-network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.1
    container_name: transcendence-logstash
    profiles: ["elk"]
    user: root
    init: true
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./Devops/monitoring/elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    networks:
      - transcendence-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    container_name: transcendence-kibana
    profiles: ["elk"]
    init: true
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - "NODE_OPTIONS=--max-old-space-size=1024"
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    ports:
      - "5601:5601"
    networks:
      - transcendence-network
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.1
    container_name: transcendence-filebeat
    profiles: ["elk"]
    init: true
    user: root
    depends_on:
      - logstash
    volumes:
      - ./Devops/monitoring/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /goinfre/omadali/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e --strict.perms=false
    networks:
      - transcendence-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  elk_data:

networks:
  transcendence-network:
    driver: bridge
