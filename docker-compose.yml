services:
  database:
    image: postgres:16-alpine
    container_name: transendence-db
    labels:
      - "autoheal=true"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-transendence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transendence-network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: ../Devops/docker/backend.Dockerfile
    container_name: transendence-backend
    labels:
      - "autoheal=true"
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=${DB_NAME:-transendence};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Development}
      DOTNET_EnableWriteXorExecute: "0"
      OAUTH_INTRA_CLIENT_ID: "${OAUTH_INTRA_CLIENT_ID:-default-42-client-id}"
      OAUTH_INTRA_CLIENT_SECRET: "${OAUTH_INTRA_CLIENT_SECRET:-default-42-client-secret}"
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-default-google-client-id}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-default-google-client-secret}"
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- http://127.0.0.1:5000/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transendence-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: ../Devops/docker/frontend.Dockerfile
    container_name: transendence-frontend
    labels:
      - "autoheal=true"
    environment:
      PUBLIC_API_URL: "https://localhost/api"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transendence-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: ../Devops/docker/nginx.Dockerfile
    container_name: transendence-nginx
    labels:
      - "autoheal=true"
    depends_on:
      - frontend
      - backend
      - grafana
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/nginx_status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  # ========================
  # Monitoring Services
  # ========================
  prometheus:
    image: prom/prometheus:latest
    container_name: transendence-prometheus
    labels:
      - "autoheal=true"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transendence-grafana
    labels:
      - "autoheal=true"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-transendence42}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - transendence-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: transendence-node-exporter
    labels:
      - "autoheal=true"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: transendence-cadvisor
    labels:
      - "autoheal=true"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: transendence-postgres-exporter
    labels:
      - "autoheal=true"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-transendence}?sslmode=disable"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: transendence-nginx-exporter
    labels:
      - "autoheal=true"
    depends_on:
      - nginx
    command:
      - "--nginx.scrape-uri=http://nginx:8888/nginx_status"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9113/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - transendence-network
    restart: unless-stopped

  # ========================
  # Auto-Heal
  # ========================
  autoheal:
    build:
      context: ./monitoring/autoheal
      dockerfile: ../../Devops/docker/autoheal.Dockerfile
    container_name: transendence-autoheal
    environment:
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - transendence-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  transendence-network:
    driver: bridge
